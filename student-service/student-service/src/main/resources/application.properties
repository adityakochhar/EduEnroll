spring.application.name=student-service
# Render sets PORT; local/dev can use SERVER_PORT
server.port=${PORT:${SERVER_PORT:8080}}
server.address=0.0.0.0
# Set SPRING_LAZY_INIT=true on Render so the HTTP port opens before full JPA init (avoids early health-check timeouts).
spring.main.lazy-initialization=${SPRING_LAZY_INIT:false}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/student_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Base64-encoded key (>= 256 bits after decode). Override in production with JWT_SECRET.
jwt.secret=${JWT_SECRET:RWR1RW5yb2xsRGV2T25seVNlY3JldEtleUF0TGVhc3QzMkNoYXJhY3RlcnNMb25nIQ==}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}
