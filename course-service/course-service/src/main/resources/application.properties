spring.application.name=course-service
# Render sets PORT; local/dev can use SERVER_PORT
server.port=${PORT:${SERVER_PORT:8081}}
server.address=0.0.0.0
# Set SPRING_LAZY_INIT=true on Render for faster port-open during cold starts (optional).
spring.main.lazy-initialization=${SPRING_LAZY_INIT:false}

# MySQL — set SPRING_DATASOURCE_* (or use application-local.properties, gitignored) for real credentials
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/course_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Student-service REST base (no trailing slash). Set on Render so stats/popularity/delete sync works.
app.student.api.base-url=${STUDENT_SERVICE_API_BASE:http://localhost:8080/api/student}
